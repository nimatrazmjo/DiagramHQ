name: diagramhq

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-diagramhq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-diagramhq}
      POSTGRES_DB: ${POSTGRES_DB:-diagramhq}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-diagramhq}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      API_PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-diagramhq}:${POSTGRES_PASSWORD:-diagramhq}@postgres:5432/${POSTGRES_DB:-diagramhq}
      REDIS_URL: redis://redis:6379
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    develop:
      watch:
        - action: rebuild
          path: ./apps/api
          ignore:
            - node_modules/
        - action: rebuild
          path: ./packages/domain

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      INTERNAL_API_URL: http://api:4000
      AUTH_TRUST_HOST: "true"
      AUTH_SECRET: ${AUTH_SECRET:-diagramhq-dev-auth-secret-minimum-32-chars!}
      NEXTAUTH_URL: http://localhost:3000
    ports:
      - '3000:3000'
    depends_on:
      - api
    develop:
      watch:
        - action: rebuild
          path: ./apps/web
          ignore:
            - node_modules/
            - .next/
        - action: rebuild
          path: ./packages/domain

volumes:
  pgdata:
