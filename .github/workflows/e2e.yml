name: Playwright E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    name: E2E Matrix (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, Mobile Chrome, Mobile Safari]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: diagramhq
          POSTGRES_PASSWORD: diagramhq
          POSTGRES_DB: diagramhq
        ports:
          - '5433:5432'
        options: >-
          --health-cmd "pg_isready -U diagramhq"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://diagramhq:diagramhq@localhost:5433/diagramhq
      CI: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build domain package
        run: pnpm build:domain

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: Deploy Database Migrations
        run: pnpm db:migrate

      - name: Build Web Application
        run: pnpm --filter @diagramhq/web build

      - name: Install Playwright Browsers & OS Dependencies
        run: pnpm --filter @diagramhq/web exec playwright install --with-deps

      - name: Run Playwright E2E Tests (${{ matrix.project }})
        run: pnpm --filter @diagramhq/web exec playwright test --project="${{ matrix.project }}"

      - name: Upload Playwright Test Report & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ matrix.project }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14
