{{- if .Values.minio.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "diagramhq.minio.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "diagramhq.minio.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "diagramhq.minio.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "diagramhq.minio.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: minio
          image: {{ printf "%s%s:%s" (ternary (printf "%s/" (trimSuffix "/" .Values.minio.image.registry)) "" (not (empty .Values.minio.image.registry))) .Values.minio.image.repository .Values.minio.image.tag }}
          imagePullPolicy: {{ .Values.minio.image.pullPolicy | default "IfNotPresent" }}
          command:
            - /bin/sh
            - -c
            - minio server /data --console-address ":9001"
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              value: {{ .Values.minio.rootUser | quote }}
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.minio.existingSecret | default (printf "%s-secrets" (include "diagramhq.fullname" .)) }}
                  key: minio-root-password
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            {{- toYaml .Values.minio.resources | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          {{- if .Values.minio.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "diagramhq.minio.fullname" . }}-pvc
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- if .Values.minio.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "diagramhq.minio.fullname" . }}-pvc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "diagramhq.minio.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.minio.persistence.storageClass }}
  storageClassName: {{ .Values.minio.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.minio.persistence.size | quote }}
{{- end }}
{{- end }}
