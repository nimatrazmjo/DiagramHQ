{{- if .Values.minio.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "diagramhq.minio.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "diagramhq.minio.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: s3
      port: 9000
      targetPort: s3
      protocol: TCP
    - name: console
      port: 9001
      targetPort: console
      protocol: TCP
  selector:
    {{- include "diagramhq.minio.selectorLabels" . | nindent 4 }}
{{- end }}
