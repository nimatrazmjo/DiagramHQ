{{- if and .Values.postgresql.enabled (not .Values.database.host) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "diagramhq.database.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "diagramhq.database.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
      protocol: TCP
  selector:
    {{- include "diagramhq.database.selectorLabels" . | nindent 4 }}
{{- end }}
