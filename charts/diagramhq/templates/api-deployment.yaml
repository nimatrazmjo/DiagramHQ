apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "diagramhq.api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "diagramhq.api.labels" . | nindent 4 }}
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "diagramhq.api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secrets: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "diagramhq.api.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.api.imagePullSecrets | default .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "diagramhq.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.api.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          securityContext:
            {{- toYaml .Values.api.securityContext | nindent 12 }}
          image: {{ include "diagramhq.api.image" . }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy | default .Values.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "diagramhq.fullname" . }}-config
          env:
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret | default (printf "%s-secrets" (include "diagramhq.fullname" .)) }}
                  key: {{ .Values.auth.existingSecretKey | default "auth-secret" }}
            {{- if .Values.database.existingSecretDatabaseUrlKey }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.existingSecretDatabaseUrlKey }}
            {{- else if not .Values.database.existingSecret }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-secrets" (include "diagramhq.fullname" .) }}
                  key: database-url
            {{- end }}
            - name: REDIS_URL
              value: {{ include "diagramhq.redis.url" . | quote }}
            {{- if or .Values.license.offlineKey .Values.license.existingSecret }}
            - name: OFFLINE_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.license.existingSecret | default (printf "%s-secrets" (include "diagramhq.fullname" .)) }}
                  key: {{ .Values.license.existingSecretKey | default "offline-license-key" }}
            {{- end }}
            {{- if or .Values.storage.accessKey .Values.storage.existingSecret }}
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.storage.existingSecret | default (printf "%s-secrets" (include "diagramhq.fullname" .)) }}
                  key: {{ .Values.storage.existingSecretAccessKeyKey | default "storage-access-key" }}
            {{- end }}
            {{- if or .Values.storage.secretKey .Values.storage.existingSecret }}
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.storage.existingSecret | default (printf "%s-secrets" (include "diagramhq.fullname" .)) }}
                  key: {{ .Values.storage.existingSecretSecretKeyKey | default "storage-secret-key" }}
            {{- end }}
            {{- range $key, $value := .Values.api.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.api.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.api.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
