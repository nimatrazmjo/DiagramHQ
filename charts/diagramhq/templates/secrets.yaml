{{- $secretName := printf "%s-secrets" (include "diagramhq.fullname" .) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "diagramhq.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- /* Auth secret */}}
  {{- if not .Values.auth.existingSecret }}
  auth-secret: {{ .Values.auth.secret | quote }}
  {{- end }}

  {{- /* Database password and calculated DATABASE_URL */}}
  {{- if not .Values.database.existingSecret }}
  {{- $dbPass := include "diagramhq.database.password" . }}
  {{- $dbHost := include "diagramhq.database.host" . }}
  {{- $dbPort := include "diagramhq.database.port" . }}
  {{- $dbName := include "diagramhq.database.name" . }}
  {{- $dbUser := include "diagramhq.database.user" . }}
  {{- $dbSsl := .Values.database.sslMode | default "disable" }}
  database-password: {{ $dbPass | quote }}
  database-url: {{ printf "postgresql://%s:%s@%s:%v/%s?sslmode=%s" $dbUser $dbPass $dbHost $dbPort $dbName $dbSsl | quote }}
  {{- end }}

  {{- /* License offline key */}}
  {{- if and .Values.license.offlineKey (not .Values.license.existingSecret) }}
  offline-license-key: {{ .Values.license.offlineKey | quote }}
  {{- end }}

  {{- /* Storage secrets */}}
  {{- if and .Values.storage.accessKey (not .Values.storage.existingSecret) }}
  storage-access-key: {{ .Values.storage.accessKey | quote }}
  {{- end }}
  {{- if and .Values.storage.secretKey (not .Values.storage.existingSecret) }}
  storage-secret-key: {{ .Values.storage.secretKey | quote }}
  {{- end }}

  {{- /* MinIO secrets */}}
  {{- if and .Values.minio.enabled (not .Values.minio.existingSecret) }}
  minio-root-password: {{ .Values.minio.rootPassword | quote }}
  {{- end }}

  {{- /* Redis password */}}
  {{- if and .Values.redis.enabled .Values.redis.auth.enabled (not .Values.redis.auth.existingSecret) }}
  redis-password: {{ .Values.redis.auth.password | quote }}
  {{- end }}
