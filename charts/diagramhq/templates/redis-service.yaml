{{- if and .Values.redis.enabled (not .Values.redis.host) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "diagramhq.redis.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "diagramhq.redis.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
  selector:
    {{- include "diagramhq.redis.selectorLabels" . | nindent 4 }}
{{- end }}
